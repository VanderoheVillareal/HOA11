---
- name: Build and run the web and database container
  hosts: managed
  become: true
  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: /opt/activity11
        state: directory
        mode: "0755"

    - name: Copy Dockerfile
      ansible.builtin.copy:
        src: Dockerfile
        dest: /opt/activity11/Dockerfile
        mode: "0644"

    - name: Copy startup script
      ansible.builtin.copy:
        src: start.sh
        dest: /opt/activity11/start.sh
        mode: "0755"

    - name: Build Docker image
      ansible.builtin.command:
        cmd: docker build -t activity11-webdb:latest /opt/activity11

    - name: Remove previous container if it exists
      ansible.builtin.command:
        cmd: docker rm -f activity11-container
      failed_when: false
      changed_when: false

    - name: Run web and database container
      ansible.builtin.command:
        cmd: docker run -d --name activity11-container -p 8080:80 -p 3307:3306 activity11-webdb:latest

    - name: Verify running container
      ansible.builtin.command:
        cmd: docker ps
      register: docker_status
      changed_when: false

    - name: Display container status
      ansible.builtin.debug:
        var: docker_status.stdout_lines
